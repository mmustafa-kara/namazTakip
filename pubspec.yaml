name: flutter_ezan_uygulamasi
description: "Ezan Vakti Pro — Premium glassmorphism prayer times app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── HTTP / Networking ────────────────────────────────────────────────────────
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # ── Local Database (Hive) ───────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── Location & Compass ──────────────────────────────────────────────────────
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  flutter_compass: ^0.8.1

  # ── Notifications ────────────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^3.0.1

  # ── Typography (Google Fonts) ────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Utilities ────────────────────────────────────────────────────────────────
  intl: ^0.20.2
  equatable: ^2.0.7
  path_provider: ^2.1.5
  vibration: ^3.1.3
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ───────────────────────────────────────────────────────────
  build_runner: ^2.4.15
  # hive_generator removed — conflicts with riverpod_lint analyzer ^7.0.0
  # TypeAdapters will be written manually (simpler for this project scale)
  riverpod_generator: ^2.6.4
  # custom_lint and riverpod_lint removed — cause flutter analyze to hang
  # Re-enable when running `dart run custom_lint` directly instead
  # custom_lint: ^0.7.5
  # riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/turkiye_il_ilce.json

